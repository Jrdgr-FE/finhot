name: 问题反馈
description: 部署、运行或代码里的错误
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认贴出来的日志和配置里没有密钥、密码、服务器地址。线上站点 finhot.fun 的内容更正请用站内的“反馈”页。
        安全问题请不要开 issue，按 [SECURITY.md](https://github.com/Jrdgr-FE/finhot/blob/main/SECURITY.md) 私下报告。
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - Docker Compose
        - 本机直接运行（不用 Docker）
        - 服务器 + Cloudflare 同步前台
        - Cloudflare 回源前台
        - Cloudflare 全托管（deploy/free）
        - 只是在读代码
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: "`git rev-parse --short HEAD` 的输出"
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么、期望看到什么、实际看到什么。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 比如 `docker compose logs --tail 100 api worker web`，或后台“运行”页的报错。
      render: text
