name: 功能建议
description: 想要的新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 从你的使用场景说起，比如“作为基金经理，我每天早上想先看到……”。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么凑合
