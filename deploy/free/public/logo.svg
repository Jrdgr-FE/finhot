       色板与 Lab Gateway 控制台的标识一致：紫色底 #7361ed、白色主体、浅紫信号点 #d4cdff。 -->
  <rect width="512" height="512" rx="154" fill="#7361ed"/>
  <g fill="#ffffff">
    <rect x="104" y="286" width="72" height="122" rx="14"/>
    <rect x="220" y="212" width="72" height="196" rx="14"/>
    <rect x="336" y="138" width="72" height="270" rx="14"/>
  </g>
  <circle cx="372" cy="96" r="30" fill="#d4cdff"/>
</svg>
